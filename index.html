<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>電卓</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
      }
      .calculator {
        background-color: #333;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }
      #display {
        width: 100%;
        height: 60px;
        font-size: 2em;
        text-align: right;
        margin-bottom: 10px;
        padding: 5px;
        background-color: #eee;
        border: none;
        border-radius: 5px;
        box-sizing: border-box;
      }
      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      button {
        width: 100%;
        padding: 15px;
        font-size: 1.2em;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      button:hover {
        background-color: #ddd;
      }
      .operator {
        background-color: #f1a33c;
        color: white;
      }
      .operator:hover {
        background-color: #d9912c;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <input type="text" id="display" readonly />
      <div class="buttons">
        <button data-testid="btn-clear">C</button>
        <button data-testid="btn-paren-left">(</button>
        <button data-testid="btn-paren-right">)</button>
        <button data-testid="btn-divide" class="operator">/</button>
        <button data-testid="btn-7">7</button>
        <button data-testid="btn-8">8</button>
        <button data-testid="btn-9">9</button>
        <button data-testid="btn-multiply" class="operator">×</button>
        <button data-testid="btn-4">4</button>
        <button data-testid="btn-5">5</button>
        <button data-testid="btn-6">6</button>
        <button data-testid="btn-subtract" class="operator">-</button>
        <button data-testid="btn-1">1</button>
        <button data-testid="btn-2">2</button>
        <button data-testid="btn-3">3</button>
        <button data-testid="btn-add" class="operator">+</button>
        <button data-testid="btn-0">0</button>
        <button data-testid="btn-dot">.</button>
        <button data-testid="btn-backspace">←</button>
        <button data-testid="btn-equals" class="operator">=</button>

        <button data-testid="btn-quotient-remainder">商・余り</button>
      </div>
    </div>
    <script>
      // DOM取得
      const display = document.getElementById("display");

      const numberButtons = document.querySelectorAll(
        '[data-testid="btn-0"], [data-testid="btn-1"], [data-testid="btn-2"], [data-testid="btn-3"], [data-testid="btn-4"], [data-testid="btn-5"], [data-testid="btn-6"], [data-testid="btn-7"], [data-testid="btn-8"], [data-testid="btn-9"]',
      );

      const extraButtons = document.querySelectorAll(
        '[data-testid="btn-dot"], [data-testid="btn-paren-left"], [data-testid="btn-paren-right"]',
      );

      const clearButton = document.querySelector('[data-testid="btn-clear"]');
      const backspaceButton = document.querySelector(
        '[data-testid="btn-backspace"]',
      );
      const operatorButtons = document.querySelectorAll(
        '[data-testid="btn-divide"], [data-testid="btn-multiply"], [data-testid="btn-subtract"], [data-testid="btn-add"]',
      );

      const equalsButton = document.querySelector('[data-testid="btn-equals"]');

      const quotientRemainderButton = document.querySelector(
        '[data-testid="btn-quotient-remainder"]',
      );

      let resultType = null;

      // 関数定義
      function showError() {
        display.value = "Error";
        resultType = null;
      }

      function resetDisplay() {
        display.value = "";
        resultType = null;
      }

      function appendToDisplay(text) {
        if (display.value === "Error" || resultType !== null) {
          resetDisplay();
        }

        display.value += text;
      }

      function calculateResult() {
        try {
          const expression = display.value.replace(/×/g, "*");
          const result = eval(expression);

          if (Number.isFinite(result)) {
            display.value = result;
            resultType = "normal";
          } else {
            showError();
          }
        } catch (error) {
          showError();
        }
      }

      function calculateQuotientRemainder() {
        const parts = display.value.split("/");

        if (parts.length !== 2 || parts[0] === "" || parts[1] === "") {
          showError();
          return;
        }

        const dividend = Number(parts[0]);
        const divisor = Number(parts[1]);

        if (
          !Number.isInteger(dividend) ||
          !Number.isInteger(divisor) ||
          divisor === 0
        ) {
          showError();
          return;
        }

        const quotient = Math.trunc(dividend / divisor);
        const remainder = dividend % divisor;

        display.value = `商: ${quotient} 余り: ${remainder}`;
        resultType = "quotient";
      }

      // イベント
      numberButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          appendToDisplay(button.textContent);
        });
      });

      clearButton.addEventListener("click", function () {
        resetDisplay();
      });

      backspaceButton.addEventListener("click", function () {
        if (display.value === "Error" || resultType === "quotient") {
          resetDisplay();
          return;
        }

        if (resultType === "normal") {
          resultType = null;
        }

        display.value = display.value.slice(0, -1);
      });

      operatorButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          if (display.value === "Error") {
            return;
          }

          if (resultType === "quotient") {
            return;
          }

          if (resultType === "normal") {
            resultType = null;
          }

          display.value += button.textContent;
        });
      });

      extraButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          appendToDisplay(button.textContent);
        });
      });

      equalsButton.addEventListener("click", function () {
        calculateResult();
      });

      quotientRemainderButton.addEventListener("click", function () {
        calculateQuotientRemainder();
      });
    </script>
  </body>
</html>
